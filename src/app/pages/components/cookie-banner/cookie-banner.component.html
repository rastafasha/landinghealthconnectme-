<div class="cookie-banner position-fixed bottom-0 start-0 w-100 bg-dark text-white p-3 shadow-lg" 
     *ngIf="!cookiesAceptadas" 
     style="z-index: 1050; border-top: 3px solid #0d6efd;">
  <div class="container">
    <div class="row align-items-center">
      <!-- Texto informativo -->
      <div class="col-12 col-md-8 mb-3 mb-md-0 text-start">
        <p class="mb-0 small text-light">
          Utilizamos cookies propias y de terceros para analizar la navegación de los usuarios y mejorar la plataforma médica. 
          Al hacer clic en "Aceptar todas", consiente su uso. Puede obtener más información en nuestra 
          <a routerLink="/politica-cookies" class="text-info text-decoration-underline">Política de Cookies</a>.
        </p>
      </div>
      <!-- Botones de Acción -->
      <div class="col-12 col-md-4 text-md-end text-center d-flex justify-content-md-end justify-content-center gap-2">
        <button type="button" class="btn btn-outline-light btn-sm px-3" (click)="irAConfiguracion()">
          Configurar
        </button>
        <button type="button" class="btn btn-primary btn-sm px-3 fw-bold" (click)="aceptarTodasCookies()">
          Aceptar todas
        </button>
      </div>
    </div>
  </div>
</div>
